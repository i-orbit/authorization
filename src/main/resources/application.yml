server:
  port: 30703
spring:
  application:
    name: authorization
  profiles:
    active: dev
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      config:
        server-addr: 192.168.26.160:30848
        username: nacos
        password: zaq1@WSX
        namespace: DEV_H160
        file-extension: yml
  config:
    import:
      - nacos:datasource.yml
      - nacos:kafka.yml
      - optional:nacos:security.yml
      - optional:nacos:${spring.application.name}.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${datasource.mysql.host}:${datasource.mysql.port}/iam?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${datasource.mysql.username}
    password: ${datasource.mysql.password}
  data:
    redis:
      host: ${datasource.redis.host}
      port: ${datasource.redis.port}
      password: ${datasource.redis.password}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  kafka:
    bootstrap-servers: ${kafka.bootstrap-servers}
    producer:
      acks: all
      retries: 3
      properties:
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        max.block.ms: 60000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
